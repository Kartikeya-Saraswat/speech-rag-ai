<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech RAG AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #ede9fe, transparent 35%),
                #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #172033;
        }

        .container {
            width: min(720px, 92%);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 38px;
            box-shadow: 0 20px 60px rgba(30, 41, 59, 0.12);
        }

        h1 {
            text-align: center;
            margin: 0 0 35px;
            font-size: 32px;
            letter-spacing: -0.8px;
            color: #111827;
        }

        h2 {
            font-size: 19px;
            margin: 28px 0 14px;
            color: #1f2937;
        }

        .section {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: white;
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
            margin-bottom: 14px;
            cursor: pointer;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        button:active {
            transform: translateY(0);
        }

        #uploadBtn {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
        }

        #recordBtn {
            display: block;
            margin: 12px auto;
            background: linear-gradient(135deg, #111827, #374151);
            color: white;
            font-size: 16px;
            padding: 14px 25px;
        }

        #recordBtn.recording {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            animation: pulse 1.5s infinite;
        }

        #status {
            text-align: center;
            margin: 12px 0;
            font-size: 14px;
            color: #64748b;
            min-height: 20px;
        }

        .answer-box {
            background: linear-gradient(135deg, #eff6ff, #f5f3ff);
            border: 1px solid #dbeafe;
            border-radius: 16px;
            padding: 20px;
            min-height: 90px;
            line-height: 1.6;
            color: #334155;
        }

        .mic-icon {
            font-size: 20px;
            margin-right: 6px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-top: -25px;
            margin-bottom: 30px;
            font-size: 14px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
            }

            70% {
                box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎙️ Speech RAG AI</h1>
        <p class="subtitle">
            Ask questions about your documents using your voice
        </p>
        <div class="section">
            <h2>1. Upload PDF</h2>

            <input type="file" id="pdfFile" accept=".pdf">

            <button id="uploadButton">
                Upload PDF
            </button>
        </div>

        <div class="section">
            <h2>2. Ask your document</h2>

            <button id="recordBtn">
                <span class="mic-icon">🎙️</span>
                Start Recording
            </button>

            <div id="status">
                Upload a PDF first.
            </div>
        </div>

        <div class="section">
            <h2>Answer</h2>
            <div id="answer" class="answer-box">
                Your AI answer will appear here.
            </div>
        </div>

    </div>

    <script>

        let mediaRecorder;
        let audioChunks = [];

        const uploadButton = document.getElementById("uploadButton");
        const pdfFile = document.getElementById("pdfFile");

        const recordButton = document.getElementById("recordButton");
        const status = document.getElementById("status");
        const answer = document.getElementById("answer");


        /* -----------------------------
           PDF UPLOAD
        ----------------------------- */

        uploadButton.addEventListener("click", async () => {

            if (!pdfFile.files.length) {
                alert("Please select a PDF first.");
                return;
            }

            const formData = new FormData();

            formData.append("file", pdfFile.files[0]);

            status.textContent = "Processing PDF...";

            try {

                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("PDF upload failed.");
                }

                const data = await response.json();

                status.textContent =
                    `PDF ready: ${data.chunks_created} chunks indexed.`;

            } catch (error) {

                status.textContent = "PDF processing failed.";
                console.error(error);
            }
        });


        /* -----------------------------
           MICROPHONE
        ----------------------------- */

        recordButton.addEventListener("click", async () => {

            if (mediaRecorder && mediaRecorder.state === "recording") {

                mediaRecorder.stop();

                recordButton.textContent = "🎙️ Start Recording";
                recordButton.classList.remove("recording");

                return;
            }

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });

                audioChunks = [];

                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {

                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {

                    stream.getTracks().forEach(track => track.stop());

                    const audioBlob = new Blob(
                        audioChunks,
                        { type: mediaRecorder.mimeType }
                    );

                    await sendVoice(audioBlob);
                };

                mediaRecorder.start();

                recordButton.textContent = "⏹️ Stop Recording";
                recordButton.classList.add("recording");

                status.textContent = "Listening... Speak now.";

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Microphone permission was denied or unavailable.";
            }
        });


        /* -----------------------------
           SEND VOICE TO BACKEND
        ----------------------------- */

        async function sendVoice(audioBlob) {

            status.textContent = "Thinking...";

            const formData = new FormData();

            formData.append(
                "file",
                audioBlob,
                "question.webm"
            );

            try {

                const response = await fetch("/voice", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("Voice request failed.");
                }

                const audioData = await response.blob();

                const audioUrl = URL.createObjectURL(audioData);

                const audio = new Audio(audioUrl);

                audio.play();

                status.textContent = "Answer ready.";

                answer.textContent =
                    "🔊 Playing AI response...";

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Something went wrong processing your question.";
            }
        }

    </script>

</body>

</html>
